name: Apply stable fit-width scroll behavior

on:
  push:
    branches:
      - feat/autostart-display-resume

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip pytest .
      - name: Apply stable fit-width scroll behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/owndash/gui/canvas.py')
          text = path.read_text()
          old = '''    def fit_canvas_width(self) -> None:\n        \"\"\"Fit the dashboard width for comfortable editing while keeping vertical scrolling.\"\"\"\n        self.auto_fit = False\n        self.auto_fit_width = True\n        gutter = 24\n        usable_width = max(1, self.viewport().width() - gutter * 2)\n        target = max(0.01, min(3.0, usable_width / max(1, self.canvas_size.width)))\n        self.resetTransform()\n        self.scale(target, target)\n        self.setAlignment(Qt.AlignHCenter | Qt.AlignTop)\n\n    def resizeEvent(self, event) -> None:  # noqa: ANN001\n        super().resizeEvent(event)\n        if self.auto_fit or self.auto_fit_width:\n            QTimer.singleShot(0, self._fit_if_enabled)\n\n    def _fit_if_enabled(self) -> None:\n        if self.auto_fit_width:\n            self.fit_canvas_width()\n        elif self.auto_fit:\n            self.fit_canvas()\n'''
          new = '''    def fit_canvas_width(self, *, anchor_y: float | None = None) -> None:\n        \"\"\"Fit dashboard width while keeping editor navigation predictable.\n\n        A deliberate switch to width-fit starts at the dashboard top. Window\n        resizes may pass the scene Y coordinate that was visible at the centre\n        before Qt changed the viewport, so the user's work position stays put.\n        \"\"\"\n        self.auto_fit = False\n        self.auto_fit_width = True\n        gutter = 24\n        usable_width = max(1, self.viewport().width() - gutter * 2)\n        target = max(0.01, min(3.0, usable_width / max(1, self.canvas_size.width)))\n        self.resetTransform()\n        self.scale(target, target)\n        self.setAlignment(Qt.AlignHCenter | Qt.AlignTop)\n\n        if anchor_y is None:\n            bar = self.verticalScrollBar()\n            bar.setValue(bar.minimum())\n        else:\n            self.centerOn(self.canvas_size.width / 2.0, anchor_y)\n\n    def resizeEvent(self, event) -> None:  # noqa: ANN001\n        anchor_y = None\n        if self.auto_fit_width:\n            # Capture the current scene position before QGraphicsView updates\n            # its viewport geometry. Measuring after super().resizeEvent()\n            # would already include the window-size jump we want to avoid.\n            anchor_y = self.mapToScene(self.viewport().rect().center()).y()\n        super().resizeEvent(event)\n        if self.auto_fit_width:\n            QTimer.singleShot(0, lambda y=anchor_y: self._fit_width_after_resize(y))\n        elif self.auto_fit:\n            QTimer.singleShot(0, self._fit_if_enabled)\n\n    def _fit_width_after_resize(self, anchor_y: float | None) -> None:\n        if self.auto_fit_width:\n            self.fit_canvas_width(anchor_y=anchor_y)\n\n    def _fit_if_enabled(self) -> None:\n        if self.auto_fit_width:\n            anchor_y = self.mapToScene(self.viewport().rect().center()).y()\n            self.fit_canvas_width(anchor_y=anchor_y)\n        elif self.auto_fit:\n            self.fit_canvas()\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one fit-width block, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Install patched working tree
        run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash -n run-owndash.sh
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "Markus"
          git config user.email "14039170+x-Fuchur-x@users.noreply.github.com"
          git rm .github/workflows/apply-fit-width-scroll-stability.yml
          git add src/owndash/gui/canvas.py
          git commit -m "fix: keep fit-width editor position stable"
          git push origin HEAD:feat/autostart-display-resume
