name: Apply Status v8 Green Pass

on:
  push:
    branches:
      - feat/autostart-display-resume

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/autostart-display-resume
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip pytest .
      - name: Apply v8 patch
        run: python .github/apply_status_v8.py
      - name: Install patched tree
        run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash -n run-owndash.sh
      - name: Commit verified v8 implementation
        run: |
          git config user.name 'Markus'
          git config user.email '14039170+x-Fuchur-x@users.noreply.github.com'
          rm .github/apply_status_v8.py .github/workflows/apply-status-v8-green.yml
          git add src/owndash/gui/system_state_frame.py tests/test_system_state_frame_v8.py .github/apply_status_v8.py .github/workflows/apply-status-v8-green.yml
          git commit -m 'feat: refine portrait system status screen v8'
          git push origin HEAD:feat/autostart-display-resume
