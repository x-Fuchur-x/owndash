name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source_patch:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'chore: run source patch'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply narrow reviewed source patch
        run: python tools/patch_info_layout.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/owndash/gui/main_window.py src/owndash/gui/canvas.py
          git diff --cached --check
          git commit -m "fix: allow removing background images"
          git push

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install pytest .
      - run: python -m compileall -q src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash -n run-owndash.sh
