name: Apply status screen polish

on:
  push:
    branches:
      - feat/autostart-display-resume

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip pytest .
      - name: Apply tested status-screen fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/owndash/gui/app_window.py')
          app = app_path.read_text()
          app = app.replace(
              'from PySide6.QtGui import QAction, QColor, QFont, QIcon, QImage, QLinearGradient, QPainter, QPen, QTransform',
              'from PySide6.QtGui import QAction, QColor, QFont, QIcon, QImage, QLinearGradient, QPainter, QPen',
          )
          old_orientation = '''        logical_w = int(self.canvas.canvas_size.width)\n        logical_h = int(self.canvas.canvas_size.height)\n        rotation = int(getattr(self, "_display_rotation", 0)) % 360\n        rotate_for_transport = self.display_backend_key == "aic_usb" and rotation in {90, 270}\n        render_w, render_h = (logical_h, logical_w) if rotate_for_transport else (logical_w, logical_h)\n\n        image = render_system_state_image(\n            render_w,\n            render_h,\n            state,\n            self.preferences.system_state_theme,\n            icon,\n            strings,\n            clock_text=clock_text,\n            date_text=date_text if state is SystemState.LOCKED else None,\n            animation_phase=animation_phase,\n        )\n        if rotate_for_transport:\n            # The USB backend rotates the JPEG into panel orientation. Build the\n            # state art in the physical portrait orientation first, then apply\n            # the inverse transport rotation so the backend lands on that exact\n            # composition instead of rotating a landscape layout into portrait.\n            pre_angle = 90 if rotation == 270 else -90\n            image = image.transformed(QTransform().rotate(pre_angle), Qt.SmoothTransformation)\n'''
          new_orientation = '''        # System-state frames follow the exact same contract as normal dashboard\n        # frames: render in the logical canvas orientation and let the selected\n        # display backend apply the configured panel rotation. Keeping rotation\n        # in one layer avoids a second transform path that can turn 90/270-degree\n        # USB panels sideways.\n        logical_w = int(self.canvas.canvas_size.width)\n        logical_h = int(self.canvas.canvas_size.height)\n\n        image = render_system_state_image(\n            logical_w,\n            logical_h,\n            state,\n            self.preferences.system_state_theme,\n            icon,\n            strings,\n            clock_text=clock_text,\n            date_text=date_text if state is SystemState.LOCKED else None,\n            animation_phase=animation_phase,\n        )\n'''
          if app.count(old_orientation) != 1:
              raise SystemExit('orientation block changed unexpectedly')
          app = app.replace(old_orientation, new_orientation)
          app_path.write_text(app)

          frame_path = Path('src/owndash/gui/system_state_frame.py')
          frame = frame_path.read_text()
          old_layout = '''    center = QPointF(width * 0.50, height * 0.280)\n    diameter = width * 0.97\n    icon_side = diameter * 0.150\n    icon_center = QPointF(center.x(), center.y() - diameter * 0.245)\n    brand_icon_rect = QRectF(\n        icon_center.x() - icon_side / 2.0,\n        icon_center.y() - icon_side / 2.0,\n        icon_side,\n        icon_side,\n    )\n    return _PortraitLayout(\n        hud_center=center,\n        hud_diameter=diameter,\n        brand_icon_rect=brand_icon_rect,\n        wordmark_rect=QRectF(width * 0.07, center.y() - height * 0.030, width * 0.86, height * 0.060),\n        wordmark_font_px=width * 0.170,\n        status_rect=QRectF(width * 0.025, height * 0.420, width * 0.95, height * 0.078),\n        status_font_px=width * 0.112,\n        detail_rect=QRectF(width * 0.08, height * 0.492, width * 0.84, height * 0.040),\n        detail_font_px=width * 0.038,\n        bar_rect=QRectF(width * 0.19, height * 0.552, width * 0.62, max(9.0, width * 0.021)),\n        context_top=height * 0.590,\n        telemetry_y=height * 0.715,\n        floor_horizon=height * 0.805,\n    )\n'''
          new_layout = '''    # The physical 480x1920 panel benefits from a calm vertical hierarchy:\n    # compact identity HUD first, then the system state as the dominant message.\n    # The old near-full-width hero ring made the branding visually louder than\n    # the actual state and left the lower two thirds of the panel underused.\n    center = QPointF(width * 0.50, height * 0.225)\n    diameter = width * 0.74\n    icon_side = diameter * 0.130\n    icon_center = QPointF(center.x(), center.y() - diameter * 0.205)\n    brand_icon_rect = QRectF(\n        icon_center.x() - icon_side / 2.0,\n        icon_center.y() - icon_side / 2.0,\n        icon_side,\n        icon_side,\n    )\n    return _PortraitLayout(\n        hud_center=center,\n        hud_diameter=diameter,\n        brand_icon_rect=brand_icon_rect,\n        wordmark_rect=QRectF(width * 0.15, center.y() - height * 0.018, width * 0.70, height * 0.046),\n        wordmark_font_px=width * 0.084,\n        status_rect=QRectF(width * 0.035, height * 0.370, width * 0.93, height * 0.085),\n        status_font_px=width * 0.140,\n        detail_rect=QRectF(width * 0.10, height * 0.455, width * 0.80, height * 0.040),\n        detail_font_px=width * 0.034,\n        bar_rect=QRectF(width * 0.22, height * 0.515, width * 0.56, max(8.0, width * 0.018)),\n        context_top=height * 0.575,\n        telemetry_y=height * 0.690,\n        floor_horizon=height * 0.820,\n    )\n'''
          if frame.count(old_layout) != 1:
              raise SystemExit('portrait layout block changed unexpectedly')
          frame = frame.replace(old_layout, new_layout)
          frame = frame.replace('            "PC DASHBOARD SYSTEM",\n            width * 0.024,', '            "SYSTEM STATUS",\n            width * 0.021,')
          frame = frame.replace('    left.setAlpha(205)\n    right.setAlpha(205)', '    left.setAlpha(145)\n    right.setAlpha(145)')
          frame = frame.replace('    for index in range(5):\n        y = height * 0.105 + index * short * 0.042', '    for index in range(3):\n        y = height * 0.110 + index * short * 0.050')
          frame = frame.replace('            color.setAlpha(105 + index * 20)', '            color.setAlpha(72 + index * 18)')
          frame = frame.replace('    center_glow = QRadialGradient(QPointF(width * 0.50, height * 0.285), width * 0.72)', '    center_glow = QRadialGradient(QPointF(width * 0.50, height * 0.225), width * 0.62)')
          frame_path.write_text(frame)

          old_test_path = Path('tests/test_system_state_window.py')
          old_test = old_test_path.read_text()
          pattern = re.compile(
              r'def test_system_state_renderer_uses_physical_portrait_before_usb_rotation\(state_window, monkeypatch\):\n.*?(?=\ndef test_usb_resume_reconnect_status_uses_active_language)',
              re.S,
          )
          replacement = '''def test_system_state_renderer_leaves_usb_rotation_to_backend(state_window, monkeypatch):\n    window = state_window\n    window.display_backend_key = "aic_usb"\n    window._display_rotation = 270\n    logical_w = int(window.canvas.canvas_size.width)\n    logical_h = int(window.canvas.canvas_size.height)\n    calls = []\n\n    def fake_render(width, height, *_args, **_kwargs):\n        calls.append((int(width), int(height)))\n        image = QImage(int(width), int(height), QImage.Format_RGB32)\n        image.fill(0)\n        return image\n\n    monkeypatch.setattr(app_window_module, "render_system_state_image", fake_render)\n\n    payload = window._render_system_state_payload(SystemState.LOCKED)\n    transport = QImage.fromData(payload)\n\n    assert calls == [(logical_w, logical_h)]\n    assert (transport.width(), transport.height()) == (logical_w, logical_h)\n\n'''
          old_test, count = pattern.subn(replacement, old_test)
          if count != 1:
              raise SystemExit(f'legacy orientation test replacement count={count}')
          old_test_path.write_text(old_test)
          PY
      - name: Install patched working tree
        run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash -n run-owndash.sh
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "Markus"
          git config user.email "14039170+x-Fuchur-x@users.noreply.github.com"
          git rm .github/workflows/apply-status-screen-polish.yml
          git add src/owndash/gui/app_window.py src/owndash/gui/system_state_frame.py tests/test_system_state_window.py tests/test_system_state_orientation_polish.py
          git commit -m "fix: orient and polish system state screen"
          git push origin HEAD:feat/autostart-display-resume
