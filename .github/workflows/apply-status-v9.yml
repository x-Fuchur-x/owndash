name: Apply Status Screen v9

on:
  push:
    branches:
      - feat/autostart-display-resume

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'apply status screen v9')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/autostart-display-resume
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip pytest .
      - name: Apply approved v9 design
        run: python .github/apply_status_v9.py
      - name: Align v9 visual contracts
        run: python .github/adjust_status_v9_contracts.py
      - name: Install patched tree
        run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash -n run-owndash.sh
      - name: Commit verified v9 implementation
        run: |
          git config user.name "Markus"
          git config user.email "14039170+x-Fuchur-x@users.noreply.github.com"
          git add src/owndash/gui/system_state_frame.py tests/test_system_state_frame.py tests/test_system_state_frame_v9.py tests/test_system_state_frame_v8.py tests/test_display_editor_native_zoom.py tests/test_system_state_orientation_polish.py
          git rm .github/apply_status_v9.py .github/adjust_status_v9_contracts.py .github/workflows/apply-status-v9.yml
          git commit -m "feat: redesign portrait system status screen v9"
          git push origin HEAD:feat/autostart-display-resume
