name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  appimage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-venv libfuse2

      - name: Download appimagetool
        run: |
          curl -L \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build OwnDash AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OwnDash-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
