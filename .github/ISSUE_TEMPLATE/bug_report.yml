name: Bug report
description: Report a reproducible problem in OwnDash
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve OwnDash."
  - type: input
    id: version
    attributes:
      label: OwnDash version
      placeholder: "0.14.0 Beta"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution / desktop
      placeholder: "e.g. Bazzite / KDE Plasma"
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display and connection
      placeholder: "e.g. VSDISPLAY 8.8 / ArtInChip USB"
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
