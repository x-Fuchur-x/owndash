<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OwnDash — Your display. Your design.</title>
  <desc id="desc">Dark technology themed OwnDash banner with the official OwnDash icon and a stylized hardware dashboard display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111b"/>
      <stop offset="0.55" stop-color="#071522"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#39e7ff"/>
      <stop offset="0.55" stop-color="#5577ff"/>
      <stop offset="1" stop-color="#a05cff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#f7faff"/>
      <stop offset="0.62" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7657ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="45" r="210" fill="#0b4f8f" opacity="0.10"/>
  <circle cx="1110" cy="305" r="230" fill="#6d39ff" opacity="0.09"/>
  <path d="M0 314 C260 270 410 355 645 315 S975 260 1200 310 V360 H0Z" fill="#0a2238" opacity="0.34"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#brand)" opacity="0.45"/>

  <g transform="translate(55 65) scale(.70)">
    <rect x="12" y="12" width="232" height="232" rx="58" fill="#0B0E15"/>
    <path d="M61 156a76 76 0 1 1 134 0" fill="none" stroke="#252B3A" stroke-width="22" stroke-linecap="round"/>
    <path d="M61 156a76 76 0 0 1 134 0" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round"/>
    <path d="M128 139l47-47" stroke="#F7FAFF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="128" cy="139" r="18" fill="#F7FAFF"/>
    <circle cx="128" cy="139" r="8" fill="#5577FF"/>
    <path d="M74 187h108" stroke="url(#brand)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <text x="255" y="138" fill="url(#titleGrad)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">OwnDash</text>
  <text x="258" y="188" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" letter-spacing="3">YOUR DISPLAY. YOUR DESIGN.</text>
  <text x="258" y="238" fill="#a9bbcc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Open-source dashboard software for Linux displays.</text>
  <rect x="258" y="267" width="122" height="38" rx="19" fill="#0b1d2b" stroke="#275d7a"/>
  <text x="319" y="292" text-anchor="middle" fill="#dcecf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Linux</text>
  <rect x="392" y="267" width="142" height="38" rx="19" fill="#0b1d2b" stroke="#275d7a"/>
  <text x="463" y="292" text-anchor="middle" fill="#dcecf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">AppImage</text>
  <rect x="546" y="267" width="154" height="38" rx="19" fill="#0b1d2b" stroke="#275d7a"/>
  <text x="623" y="292" text-anchor="middle" fill="#dcecf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Open Source</text>

  <g transform="translate(800 78)">
    <rect x="0" y="0" width="345" height="196" rx="21" fill="#070b10" stroke="#26384b" stroke-width="3"/>
    <rect x="17" y="17" width="311" height="150" rx="10" fill="#04101a" stroke="#0e517c"/>
    <g transform="scale(.84)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g transform="translate(31 32)">
        <rect width="72" height="132" rx="8" fill="#061722" stroke="#174d70"/>
        <text x="36" y="28" text-anchor="middle" fill="#e7f4ff" font-size="13">CPU</text>
        <text x="36" y="59" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">37%</text>
        <path d="M10 100 L20 92 L28 103 L37 80 L47 98 L55 87 L64 94" fill="none" stroke="#22c7ff" stroke-width="3"/>
      </g>
      <g transform="translate(111 32)">
        <rect width="72" height="132" rx="8" fill="#061722" stroke="#174d70"/>
        <text x="36" y="28" text-anchor="middle" fill="#e7f4ff" font-size="13">GPU</text>
        <text x="36" y="59" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">42%</text>
        <path d="M10 101 L18 88 L26 95 L36 74 L46 92 L54 84 L64 91" fill="none" stroke="#38d9b0" stroke-width="3"/>
      </g>
      <g transform="translate(191 32)">
        <rect width="72" height="132" rx="8" fill="#061722" stroke="#174d70"/>
        <text x="36" y="28" text-anchor="middle" fill="#e7f4ff" font-size="13">RAM</text>
        <text x="36" y="59" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">28%</text>
        <path d="M10 102 L18 94 L27 96 L37 82 L46 97 L55 89 L64 93" fill="none" stroke="#7380ff" stroke-width="3"/>
      </g>
      <g transform="translate(271 32)">
        <rect width="101" height="132" rx="8" fill="#061722" stroke="#174d70"/>
        <text x="50" y="28" text-anchor="middle" fill="#e7f4ff" font-size="13">TEMP</text>
        <text x="50" y="59" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">46°C</text>
        <path d="M14 102 L23 91 L32 98 L42 78 L52 92 L62 83 L72 94 L86 86" fill="none" stroke="#44d6c7" stroke-width="3"/>
      </g>
      <text x="202" y="202" text-anchor="middle" fill="#8297aa" font-size="14">OwnDash</text>
    </g>
  </g>

  <text x="1140" y="42" text-anchor="end" fill="#38bdf8" font-family="Segoe Script,Brush Script MT,cursive" font-size="24" font-style="italic">Make it yours.</text>
</svg>
