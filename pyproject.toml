[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owndash"
version = "0.14.0b2"
description = "Visual Linux editor and runtime for customizable USB telemetry displays"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Markus Rosinski" }]
dependencies = [
  "PySide6>=6.8",
  "Pillow>=10",
  "pyusb>=1.2",
  "cryptography>=42",
]

[project.scripts]
owndash = "owndash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owndash = ["assets/*.svg", "resources/*.rules"]
